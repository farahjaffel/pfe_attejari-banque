version: '3.8'

services:
  # ── INFRASTRUCTURE KAFKA ──────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M" 
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── BASES DE DONNÉES ──────────────────────────────────────
  postgres-attejari:
    image: postgres:16
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: farah
      POSTGRES_DB: BD_ATTEJARI
    volumes:
      - postgres_attejari_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "BD_ATTEJARI"]
      interval: 10s

  postgres-airflow:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airflow_metadata
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "airflow_metadata"]
      interval: 10s

  # ── VOS SCRIPTS KAFKA ─────────────────────────────────────
  consumer:
    build: 
      context: ..
      dockerfile: docker/Dockerfile.ingestion
    restart: unless-stopped
    env_file:
      - ../.env  # <--- Correction : Charge les variables DB_HOST et DB_NAME
    command: python -m ingestion.consumer_kafka
    depends_on:
      kafka: { condition: service_healthy }
      postgres-attejari: { condition: service_healthy }
    volumes: ["..:/app"]

  producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ingestion
    restart: unless-stopped
    env_file:
      - ../.env  # <--- Correction : Charge les variables Kafka
    command: python -m ingestion.producer_kafka_final
    depends_on:
      kafka: { condition: service_healthy }
    volumes: ["..:/app"]

  # ── AIRFLOW ORCHESTRATION ─────────────────────────────────
  airflow-common: &airflow-common
    build: ../airflow_attijari
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres-airflow/airflow_metadata
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      KAIROS_DB_HOST: postgres-attejari
      KAIROS_DB_PORT: "5432"
      KAIROS_DB_PASSWORD: farah
    volumes:
      - ../airflow_attijari/dags:/opt/airflow/dags
      - ../airflow_attijari/logs:/opt/airflow/logs
      - ..:/opt/airflow/kairos

  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow users create --username airflow --password airflow --firstname Farah --lastname Jaffel --role Admin --email farah@attijari.tn || true"
    depends_on:
      postgres-airflow: { condition: service_healthy }

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    restart: unless-stopped
    ports: ["8085:8080"]
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      - airflow-init

volumes:
  postgres_attejari_data:
  postgres_airflow_data: